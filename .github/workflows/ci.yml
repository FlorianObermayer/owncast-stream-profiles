# Continuous integration, for pull requests and pushes to main.
#
# The verification itself lives in .github/actions/verify, which the release uses
# too. This file only decides when to run it and gates dependency changes. What
# the checks are protecting is documented there, next to the steps that do it.
#
# Actions are pinned by SHA rather than tag on purpose. A tag is mutable, so
# `@v7` is whoever controls that repository today. The version is kept in a
# trailing comment for humans and for Dependabot, which rewrites both.

name: CI

# Without this a run is titled with the triggering commit's subject line, which
# says nothing about what ran. GitHub shows this instead and keeps the commit
# underneath it.
run-name: "${{ github.event_name == 'pull_request' && format('CI: pull request #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('CI: {0}', github.ref_name) }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This exact string is a required status check in branch protection. That is
    # also why the shared logic is a composite action and not a reusable
    # workflow: a called job reports as "<caller> / <called>".
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and package
        uses: ./.github/actions/verify

  dependency-review:
    name: Review dependency changes
    # Only meaningful on pull requests: it diffs the dependency graph against the
    # base branch and fails if the PR introduces a known-vulnerable package.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
