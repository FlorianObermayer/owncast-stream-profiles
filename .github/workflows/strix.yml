name: AI security scan

on:
  schedule:
    # Mondays, 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      scan-mode:
        description: Scan depth
        type: choice
        options: [quick, standard, deep]
        default: quick
      max-budget:
        description: Spend cap in USD
        type: string
        default: "5"

permissions: {}

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Strix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Strix
        run: |
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)' || {
            echo "strix-agent requires Python 3.12 or newer" >&2
            python3 --version >&2
            exit 1
          }
          pipx install "strix-agent==1.7.0"
          strix --version

      - name: Run the scan
        env:
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Optional: only needed for a gateway or a non-default endpoint.
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          STRIX_TELEMETRY: "0"
        run: |
          if [ -z "${LLM_API_KEY}" ] || [ -z "${STRIX_LLM}" ]; then
            echo "::error::Set the LLM_API_KEY secret and the STRIX_LLM variable." >&2
            exit 1
          fi
          [ -n "${LLM_API_BASE}" ] || unset LLM_API_BASE
          echo "Model: ${STRIX_LLM}" >> "$GITHUB_STEP_SUMMARY"

          # 0 = no findings, 2 = findings, 1 = error. Only an error fails the job.
          set +e
          strix -n \
            --target . \
            --scan-mode "${{ inputs.scan-mode || 'quick' }}" \
            --max-budget "${{ inputs.max-budget || '5' }}" \
            --instruction-file .github/strix-instruction.md
          code=$?
          set -e

          echo "strix exited ${code}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" -eq 1 ]; then
            echo "::error::Strix could not complete. Check the key, the model id and the endpoint." >&2
            exit 1
          fi

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strix-run
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 30
