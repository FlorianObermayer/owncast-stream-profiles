name: AI security scan

on:
  pull_request:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      scan-mode:
        description: Scan depth
        type: choice
        options: [quick, standard, deep]
        default: quick
      max-budget:
        description: Spend cap in USD
        type: string
        default: "5"

permissions: {}

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Strix
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Strix
        run: |
          pipx install "strix-agent==1.7.0"
          strix --version

      - name: Run the scan
        env:
          STRIX_LLM: ${{ vars.STRIX_CI_LLM }}
          LLM_API_KEY: ${{ secrets.STRIX_CI_LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.STRIX_CI_LLM_API_BASE }}
          STRIX_TELEMETRY: "0"
          SCAN_MODE: ${{ github.event_name == 'schedule' && 'standard' || inputs.scan-mode || 'quick' }}
        run: |
          if [ -z "${LLM_API_KEY}" ] || [ -z "${STRIX_LLM}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::Strix is not configured; skipping."
              exit 0
            fi
            echo "::error::Set the STRIX_CI_LLM_API_KEY secret and the STRIX_CI_LLM variable." >&2
            exit 1
          fi
          [ -n "${LLM_API_BASE}" ] || unset LLM_API_BASE

          args=(
            --target .
            --scan-mode "${SCAN_MODE}"
            --max-budget "${{ inputs.max-budget || '5' }}"
            --instruction-file .github/strix-instruction.md
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--scope-mode diff --diff-base "origin/${{ github.base_ref }}")
          fi

          set +e
          strix -n "${args[@]}"
          code=$?
          set -e

          echo "strix exited ${code}" >> "$GITHUB_STEP_SUMMARY"
          [ "${code}" -eq 1 ] && exit 1
          exit 0

      - name: Keep only results code scanning can display
        if: github.event_name == 'pull_request' && hashFiles('strix_runs/**/*.sarif') != ''
        run: node scripts/sarif-for-code-scanning.mjs strix_runs "$RUNNER_TEMP/code-scanning"

      - name: Upload findings to code scanning
        if: github.event_name == 'pull_request' && hashFiles('strix_runs/**/*.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: ${{ runner.temp }}/code-scanning
          category: strix

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strix-run
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 30
