name: AI security scan

on:
  pull_request:
  schedule:
    # Mondays, 04:00 UTC. Cron has no fortnightly expression, so this fires
    # weekly and the gate job below skips odd ISO weeks.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      scan-mode:
        description: Scan depth
        type: choice
        options: [quick, standard, deep]
        default: quick
      max-budget:
        description: Spend cap in USD
        type: string
        default: "5"

permissions: {}

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fortnight:
    name: Fortnight check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.parity.outputs.run }}
    steps:
      - id: parity
        run: |
          # 10# forces base 10: the ISO week is zero-padded, and 08 is an
          # invalid octal literal.
          week=$((10#$(date -u +%V)))
          if [ $((week % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off week (ISO week ${week}); the next run is in a week." >> "$GITHUB_STEP_SUMMARY"
          fi

  scan:
    name: Strix
    needs: [fortnight]
    # always() so a skipped gate (every non-scheduled run) does not skip the
    # scan; its output is empty then, which is not the string "false".
    # Same-repository PRs only: a fork's PR gets no secrets, and the scan reads
    # its instruction file from the PR's own checkout.
    if: >-
      always() &&
      needs.fortnight.outputs.run != 'false' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # For the SARIF upload. `permissions` does not take expressions, so this
      # is granted on every run; the token is never handed to the scan step.
      security-events: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Strix
        run: |
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)' || {
            echo "strix-agent requires Python 3.12 or newer" >&2
            python3 --version >&2
            exit 1
          }
          pipx install "strix-agent==1.7.0"
          strix --version

      - name: Run the scan
        env:
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Optional: only needed for a gateway or a non-default endpoint.
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          STRIX_TELEMETRY: "0"
          # Scheduled runs cover the whole source, so they go deeper than a
          # diff-scoped pull request run.
          SCAN_MODE: ${{ github.event_name == 'schedule' && 'standard' || inputs.scan-mode || 'quick' }}
        run: |
          if [ -z "${LLM_API_KEY}" ] || [ -z "${STRIX_LLM}" ]; then
            # A pull request cannot fix a missing repository secret, and a red
            # check on every PR teaches people to ignore it. The scheduled run
            # still fails, which is where the owner will notice.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::Strix is not configured; skipping. Set the LLM_API_KEY secret and the STRIX_LLM variable."
              exit 0
            fi
            echo "::error::Set the LLM_API_KEY secret and the STRIX_LLM variable." >&2
            exit 1
          fi
          [ -n "${LLM_API_BASE}" ] || unset LLM_API_BASE
          echo "Model: ${STRIX_LLM}, mode: ${SCAN_MODE}" >> "$GITHUB_STEP_SUMMARY"

          # Pull requests are scanned diff-scoped: changed files against the
          # base branch, which is what keeps a quick run quick.
          args=(
            --target .
            --scan-mode "${SCAN_MODE}"
            --max-budget "${{ inputs.max-budget || '5' }}"
            --instruction-file .github/strix-instruction.md
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--scope-mode diff --diff-base "origin/${{ github.base_ref }}")
          fi

          # 0 = no findings, 2 = findings, 1 = error. Only an error fails the job.
          set +e
          strix -n "${args[@]}"
          code=$?
          set -e

          echo "strix exited ${code}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" -eq 1 ]; then
            echo "::error::Strix could not complete. Check the key, the model id and the endpoint." >&2
            exit 1
          fi

      - name: Upload findings to code scanning
        if: github.event_name == 'pull_request' && hashFiles('strix_runs/**/*.sarif') != ''
        # A malformed SARIF from an LLM scanner must not be what blocks a merge.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: strix_runs
          category: strix

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strix-run
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 30
